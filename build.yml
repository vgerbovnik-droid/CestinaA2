name: Build Cestina A2 APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'CestinaA2-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          test -f CestinaA2-source.zip || { echo 'Missing CestinaA2-source.zip in repository root'; exit 1; }
          mkdir -p extracted
          unzip -q CestinaA2-source.zip -d extracted
          test -f extracted/CestinaA2/settings.gradle.kts || { echo 'Project not found in ZIP'; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/CestinaA2
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CestinaA2-debug-apk
          path: extracted/CestinaA2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
