name: Build Cestina A2 APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'CestinaA2*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest versioned ZIP
        id: archive
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          files = glob.glob('CestinaA2*.zip')
          if not files:
              raise SystemExit('No CestinaA2 ZIP archive found in repository root')
          def version(path):
              m = re.search(r'(?i)(?:^|[-_])v(\d+(?:\.\d+)*)', os.path.basename(path))
              return tuple(map(int, m.group(1).split('.'))) if m else ()
          candidates = sorted(files, key=lambda p: (version(p), os.path.basename(p)))
          selected = candidates[-1]
          print('Selected:', selected)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'zip={selected}\n')
              f.write(f'label={os.path.splitext(os.path.basename(selected))[0]}\n')
          PY

      - name: Extract project
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.zip }}
        run: |
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          PROJECT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo 'Android project settings.gradle(.kts) not found inside ZIP' >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.label }}-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
